<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Dra. Bianca Albuquerque</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --rose:#8e5755; --rose-display:#8e5755; --ink:#2e2829; --soft:#574b4c; --cream:#fcfaf7; --blush:#e3c0ba; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:radial-gradient(900px 600px at 85% 0%, var(--blush), transparent 65%), var(--cream); line-height:1.6; }
    main { max-width:520px; text-align:center; }
    .mark { height:120px; width:auto; margin-bottom:28px; transform:rotate(-6deg); filter:drop-shadow(0 14px 16px rgba(85,48,47,.3)); }
    h1 { font-family: Georgia, serif; font-weight:400; color:var(--rose-display); font-size:clamp(2rem,6vw,3rem); line-height:1.1; margin:0 0 12px; }
    p { margin:0 0 28px; color:var(--soft); }
    a.btn { display:inline-flex; align-items:center; height:48px; padding:0 26px; border-radius:999px; background:var(--rose); color:#fff; font-weight:600; text-decoration:none; }
    a.btn:hover { background:#6e4140; }
    a:focus-visible { outline:2px solid var(--rose); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img class="mark" id="seal" src="images/selo-bianca.webp" alt="" width="640" height="610">
    <h1>Essa página <em>não existe</em>.</h1>
    <p>O endereço pode ter mudado ou ter sido digitado errado. Vamos voltar ao início?</p>
    <a class="btn" id="home" href="/">Voltar ao site</a>
  </main>
  <script>
    // Na prévia do GitHub Pages o site mora em /dra-bianca-albuquerque/; no domínio próprio, na raiz.
    var base = location.pathname.indexOf("/dra-bianca-albuquerque/") === 0 ? "/dra-bianca-albuquerque/" : "/";
    document.getElementById("home").href = base;
    document.getElementById("seal").src = base + "images/selo-bianca.webp";
    var icon = document.createElement("link"); icon.rel = "icon"; icon.type = "image/png"; icon.href = base + "favicon-48.png"; document.head.appendChild(icon);
  </script>
</body>
</html>
